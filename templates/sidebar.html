<aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-header">
        <a href="{{ url_for('index') }}" class="logo" aria-label="MathVault home">
            <span class="logo-mark">Math<span>Vault</span><span class="logo-tag">Calculus archive</span></span>
        </a>
    </div>

    <nav class="sidebar-nav" aria-label="Problem categories">
        <div class="nav-section">
            <span class="nav-section-title">Derivatives</span>
            <ul class="nav-list" role="list">
                <li>
                    <a href="{{ url_for('easy_derivatives') }}"
                       class="nav-link{% if request.path == '/derivatives/easy' %} is-active{% endif %}"
                       {% if request.path == '/derivatives/easy' %}aria-current="page"{% endif %}
                       data-difficulty="easy">
                        <span class="nav-link-label">Easy</span>
                        <span class="nav-link-badge">{{ counts.easy_derivative }}</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('medium_derivatives') }}"
                       class="nav-link{% if request.path == '/derivatives/medium' %} is-active{% endif %}"
                       {% if request.path == '/derivatives/medium' %}aria-current="page"{% endif %}
                       data-difficulty="medium">
                        <span class="nav-link-label">Medium</span>
                        <span class="nav-link-badge">{{ counts.medium_derivative }}</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="nav-section">
            <span class="nav-section-title">Integrals</span>
            <ul class="nav-list" role="list">
                <li>
                    <a href="{{ url_for('beginner_integrals') }}"
                       class="nav-link{% if request.path == '/integrals/beginner' %} is-active{% endif %}"
                       {% if request.path == '/integrals/beginner' %}aria-current="page"{% endif %}
                       data-difficulty="beginner">
                        <span class="nav-link-label">Beginner</span>
                        <span class="nav-link-badge">{{ counts.beginner_integral }}</span>
                    </a>
                </li>
                <li>
                    <a href="{{ url_for('easy_integrals') }}"
                       class="nav-link{% if request.path == '/integrals/easy' %} is-active{% endif %}"
                       {% if request.path == '/integrals/easy' %}aria-current="page"{% endif %}
                       data-difficulty="easy">
                        <span class="nav-link-label">Easy</span>
                        <span class="nav-link-badge">{{ counts.easy_integral }}</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="sidebar-footer">
        <span class="sidebar-footnote">Daily practice</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="12" cy="12" r="5"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>
</aside>
