name: Daily Integral Scraper

on:
  schedule:
    # Runs every day at 6:00 AM UTC (you can change the time)
    - cron: '30 2 * * *'
  workflow_dispatch: # Allows you to manually click a "Run" button anytime

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Stable version for Playwright & Turso

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright libsql-client python-dotenv
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          # Pulls the secrets from your GitHub repository settings
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python main.py
        